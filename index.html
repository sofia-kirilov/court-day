<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one narrow centered column, one job per screen. Scan first, then three tabs: Date, Interpreter, Paper. */
:root {
  --top: #ECECEF; --mid: #EFE7EA; --low: #F4D8D3; --end: #DDCBE9;   /* soft grey fading to rose and lilac */
  --glass: rgba(255,255,255,.58); --edge: rgba(255,255,255,.95); --solid: #FFFFFF;
  --ink: #2B2730; --muted: #6A6370; --accent: #D9481F; --mark: #FFE08A; --line: rgba(43,39,48,.14);
  --shadow: 0 12px 32px rgba(120,86,104,.14);
  --font: "Figtree", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
html { background: var(--top); }
body { min-height: 100vh; background: linear-gradient(180deg, var(--top) 0%, var(--mid) 42%, var(--low) 78%, var(--end) 100%); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; padding-inline: 18px; padding-block: 18px 56px; }
.wrap { max-width: 28rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.3rem; }
#app, .stack { display: flex; flex-direction: column; gap: 1.1rem; }
header { display: flex; justify-content: space-between; align-items: center; gap: .8rem; }
.name { font-weight: 700; font-size: 1.1rem; }
.pill { display: flex; background: var(--glass); border: 2px solid var(--edge); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.pill button { flex: 1; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 500; padding: .5rem .95rem; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.pill button[aria-pressed="true"] { background: var(--ink); color: var(--solid); }
h1 { font-weight: 700; font-size: 2rem; line-height: 1.1; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-weight: 700; font-size: 1.15rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); font-size: .92rem; }
.card { background: var(--glass); border: 2px solid var(--edge); border-radius: 28px; box-shadow: var(--shadow); padding: 1.3rem; display: flex; flex-direction: column; gap: .8rem; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); min-width: 0; }
.card.solid { background: var(--solid); }

/* scanner */
.finder { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 28px; overflow: hidden; border: 2px solid var(--edge); box-shadow: var(--shadow);
  background: radial-gradient(120% 80% at 20% 15%, #F9C9B4 0%, transparent 60%), radial-gradient(90% 70% at 85% 30%, #CFE3D2 0%, transparent 60%), radial-gradient(120% 90% at 50% 100%, #D9C6EC 0%, transparent 65%), #F3ECEC; display: grid; place-items: center; }
.finder img, .finder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sheet { width: 58%; aspect-ratio: 17 / 22; background: var(--solid); border-radius: 6px; box-shadow: 0 8px 24px rgba(80,60,80,.18); padding: 9% 8%; display: flex; flex-direction: column; gap: 6%; box-sizing: border-box; }
.sheet i { height: 4%; border-radius: 9px; background: var(--line); }
.sheet i.hit { background: var(--mark); width: 55%; }
.corner { position: absolute; width: 34px; height: 34px; border: 4px solid var(--solid); filter: drop-shadow(0 1px 3px rgba(43,39,48,.35)); }
.c1 { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
.c2 { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
.c3 { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
.c4 { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
.beam { position: absolute; left: 6%; right: 6%; height: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: sweep 1.8s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 8%; } to { top: 92%; } }
.status { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--solid); padding: .45rem 1rem; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.shutter { padding: 0; align-self: center; width: 78px; height: 78px; border-radius: 50%; background: var(--solid); border: 5px solid var(--accent); box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center; }
.shutter::after { content: ""; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); }
.shutter input, .link input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.center { text-align: center; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem 1.2rem; }
.link { background: none; border: 0; padding: .4rem 0; font: inherit; font-weight: 500; color: var(--ink); text-decoration: underline; text-underline-offset: .22em; cursor: pointer; }

/* results */
.label { color: var(--accent); font-weight: 700; }
.big { font-weight: 700; font-size: clamp(1.7rem, 8vw, 2.2rem); line-height: 1.12; letter-spacing: -.01em; }
.btn { font: inherit; font-weight: 700; padding: .85rem 1.2rem; border-radius: 999px; border: 0; background: var(--ink); color: var(--solid); cursor: pointer; text-decoration: none; text-align: center; display: block; }
.btn.soft { background: var(--solid); color: var(--ink); box-shadow: var(--shadow); }
label { font-weight: 500; display: flex; flex-direction: column; gap: .3rem; }
textarea, select, input[type="date"] { font: inherit; color: var(--ink); background: var(--solid); border: 2px solid var(--line); border-radius: 14px; padding: .7rem .8rem; width: 100%; box-sizing: border-box; }
textarea { min-height: 9rem; resize: vertical; }
ul { margin: 0; padding-left: 1.15rem; display: flex; flex-direction: column; gap: .35rem; }
.show { font-size: 1.3rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.msg { white-space: pre-wrap; user-select: all; overflow-wrap: anywhere; background: var(--solid); border-radius: 14px; padding: .8rem; }
.rows { display: flex; flex-direction: column; }
.rows > div { padding: .65rem 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.rows > div:first-child { border-top: 0; padding-top: 0; }
.rows strong { overflow-wrap: anywhere; }
.doc { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .9rem; background: var(--solid); border-radius: 14px; padding: .9rem; }
mark { background: var(--mark); color: var(--ink); border-radius: 4px; padding: 0 .15em; }
.alert { border-left: 4px solid var(--accent); padding-left: .8rem; }
:focus-visible, .shutter:focus-within, .link:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
footer { text-align: center; }
a { color: inherit; }
@media (prefers-reduced-motion: reduce) { .beam { animation: none; top: 50%; } }
</style>

</head>

// ================= 4. Deadline engine: counting court days =================

    var hh = function (h) { return ("0" + h).slice(-2) + ("0" + p.min).slice(-2) + "00"; };
    dates = day + "T" + hh(p.hour) + "/" + day + "T" + hh(Math.min(p.hour + 2, 23));
  } else { var next = new Date(date); next.setDate(next.getDate() + 1); dates = day + "/" + iso(next).replace(/-/g, ""); }
  var where = p.court ? p.court.name + ", " + p.court.addr : "";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) + "&dates=" + dates + "&ctz=America/Los_Angeles&location=" + encodeURIComponent(where) + "&details=" + encodeURIComponent("Case " + (p.caseNo || ""));
}

function scanScreen(t) {
  var h = '<div class="stack center"><h1>' + t.h1 + '</h1><p>' + t.intro + '</p></div>';
  h += '<div class="finder">' + (state.photo ? '<img alt="" src="' + state.photo + '">' : state.cam === "on" ? '<video id="live" autoplay playsinline muted></video>' : '<div class="sheet" aria-hidden="true"><i></i><i></i><i class="hit"></i><i></i><i></i><i class="hit"></i><i></i></div>') +
    '<span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>' +
    (state.busy ? '<span class="beam"></span><span class="status" id="prog">' + t.reading + '…</span>' : '') + '</div>';
  if (!state.busy) {
    // Live camera where the browser allows it; otherwise the button opens the phone camera or a file picker.
    if (canLive && state.cam !== "denied") h += '<button class="shutter" type="button" id="' + (state.cam === "on" ? "shoot" : "startcam") + '" aria-label="' + t.snap + '"></button>';
    else h += '<label class="shutter" title="' + t.snap + '"><input type="file" id="camera" accept="image/*" capture="environment" aria-label="' + t.snap + '"></label>';
    h += '<p class="muted center">' + (state.cam === "on" ? t.shootTip : state.cam === "denied" ? t.camFail : canLive ? t.camTip : t.tip) + '</p>';
    if (state.failed) h += '<p class="alert">' + t.fail + '</p>';
    if (state.typing) h += '<div class="card"><label for="typed">' + t.typeL + '<textarea id="typed"></textarea></label><button class="btn" type="button" id="go">' + t.go + '</button></div>';
    h += '<div class="links"><label class="link">' + t.pick + '<input type="file" id="library" accept="image/*"></label>' +
      (state.typing ? '' : '<button class="link" type="button" id="type">' + t.type + '</button>') +
      '<button class="link" type="button" data-ex="sum">' + t.ex1 + '</button><button class="link" type="button" data-ex="sc">' + t.ex2 + '</button></div>';
  }
  return h;
}

function resultScreen(t) {
  var p = parsePaper(state.text), h = "";
  h += '<div class="pill" role="group">' + t.tabs.map(function (x, i) { return '<button type="button" data-tab="' + i + '" aria-pressed="' + (state.tab === i) + '">' + x + '</button>'; }).join("") + '</div>';
  var due = null, label = "";
  if (p.form === "sum" && state.served) { due = addCourtDays(fromIso(state.served), 10); label = t.deadline; }
  if (p.form === "sc" && p.date) { due = p.date; label = t.hearing; }

  if (state.tab === 0) {
    if (!p.form) h += '<div class="card"><p class="alert">' + t.unknown + '</p></div>';
    else {
      h += '<div class="card solid"><h2>' + (p.form === "sum" ? t.sumName : t.scName) + '</h2>';
      if (p.form === "sum") {
        h += '<label for="served">' + t.servedL + '<input type="date" id="served" value="' + esc(state.served) + '"></label>' +
          '<label for="how">' + t.howL + '<select id="how"><option value="1"' + (state.how === "1" ? " selected" : "") + '>' + t.how1 + '</option><option value="2"' + (state.how === "2" ? " selected" : "") + '>' + t.how2 + '</option></select></label>';
      }
      if (due) {
        var now = new Date(), days = Math.round((mk(due.getFullYear(), due.getMonth(), due.getDate()) - mk(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
        h += '<div><div class="label">' + label + '</div><div class="big">' + esc(longDate(due)) + (p.form === "sc" && p.hour != null ? '<br>' + t.at + ' ' + clock(p.hour, p.min) : '') + '</div></div>';
        h += days < 0 ? '<p class="alert">' + t.passed + '</p>' : '<p><strong>' + t.left(days) + '</strong></p>';
        if (p.form === "sum" && state.how === "2") h += '<p class="alert">' + t.how2Note + '</p>';
        h += '<a class="btn" target="_blank" rel="noopener" href="' + esc(calLink(p, due, (label + " " + (p.caseNo || "")).trim())) + '">' + t.cal + '</a>';
      } else if (p.form === "sc") h += '<p class="alert">' + t.noDate + '</p>';
      h += '</div>';
      h += '<div class="card"><p>' + (p.form === "sum" ? t.sumPlain : t.scPlain) + '</p>' + (p.form === "sum" ? '<p class="muted">' + t.rule + '</p>' : '') + '</div>';
      h += '<div class="card"><h2>' + t.dayH + '</h2><ul>' + t.day.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul></div>';
    }
  }

  if (state.tab === 1) {
    var when = p.form === "sc" && due ? "Hearing date: " + due.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) + (p.hour != null ? " at " + clock(p.hour, p.min) : "") + (p.dept ? ", Department " + p.dept : "") + "\n" : "";
    var msg = "To the court clerk:\nI need a free court interpreter for " + (when ? "my hearing" : "every hearing in my case") + ".\nLanguage: " + state.interp + "\nCase number: " + (p.caseNo || "________") + "\n" + when + "My name: ________\nThank you.";
    var card = "I need a " + state.interp + " interpreter." + (p.caseNo ? " My case number is " + p.caseNo + "." : "") + (p.form === "sc" && p.dept ? " My hearing is in Department " + p.dept + "." : "") + " Where do I go?";
    h += '<div class="card"><p>' + t.intP + '</p><label for="interp">' + t.intL + '<select id="interp">' + LANGS.map(function (l) { return '<option' + (l === state.interp ? " selected" : "") + '>' + l + '</option>'; }).join("") + '</select></label></div>';
    h += '<div class="card solid"><h2>' + t.cardH + '</h2><p class="show" lang="en">' + esc(card) + '</p></div>';
    h += '<div class="card"><h2>' + t.reqH + '</h2><p class="muted">' + t.reqP + '</p><div class="msg" id="msg" lang="en">' + esc(msg) + '</div><button class="btn soft" type="button" id="copy">' + t.copy + '</button></div>';
    h += '<div class="card"><h2>' + t.sayH + '</h2><div class="rows">' + PHRASES.map(function (x) { return '<div><strong lang="en">' + x[0] + '</strong>' + (state.lang === "es" ? '<span class="muted">' + x[1] + '</span>' : '') + '</div>'; }).join("") + '</div></div>';
  }

  if (state.tab === 2) {
    var formName = p.form === "sum" ? "SUM-130" : p.form === "sc" ? "SC-100" : t.none;
    h += '<div class="card"><h2>' + t.foundH + '</h2><div class="rows">' +
      '<div><span class="muted">' + t.form + '</span><strong>' + formName + '</strong></div>' +
      '<div><span class="muted">' + t.caseNo + '</span><strong>' + esc(p.caseNo || t.none) + '</strong></div>' +
      '<div><span class="muted">' + t.court + '</span><strong>' + (p.court ? esc(p.court.name) : t.none) + '</strong>' + (p.court ? '<span>' + esc(p.court.addr) + '</span>' : '') + '</div>' +
      (p.form === "sc" ? '<div><span class="muted">' + t.dept + '</span><strong>' + esc(p.dept || t.none) + '</strong></div>' : '') + '</div></div>';
    h += '<div class="card"><h2>' + t.textH + '</h2>' + (state.fixing
      ? '<textarea id="fixed" aria-label="' + t.textH + '">' + esc(state.text) + '</textarea><button class="btn" type="button" id="refix">' + t.go + '</button>'
      : '<div class="doc">' + highlight(state.text, p.found) + '</div><button class="btn soft" type="button" id="fix">' + t.fix + '</button>') + '</div>';
    var words = GLOSSARY.filter(function (g) { return g.re.test(state.text); });
    if (words.length) h += '<div class="card"><h2>' + t.wordsH + '</h2><div class="rows">' + words.map(function (g) {
      return '<div><strong>' + g.en + (state.lang === "es" ? ' = ' + g.es : '') + '</strong><span>' + (state.lang === "es" ? g.des : g.den) + '</span></div>'; }).join("") + '</div></div>';
  }
  h += '<div class="links"><button class="link" type="button" id="again">' + t.again + '</button></div>';
  return h;
}

function render() {
  var t = T[state.lang];
  document.querySelectorAll("header .pill button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)); });
  document.documentElement.lang = state.lang;
  app.innerHTML = state.screen === "scan" ? scanScreen(t) : resultScreen(t);
  var live = document.getElementById("live"); if (live && stream) live.srcObject = stream;
  document.getElementById("foot").innerHTML = t.foot + '<a href="https://selfhelp.courts.ca.gov/" target="_blank" rel="noopener">' + t.footLink + '</a>.';
}
function stopCam() { if (stream) stream.getTracks().forEach(function (k) { k.stop(); }); stream = null; if (state.cam === "on") state.cam = "off"; }
function startCam() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false })
    .then(function (s) { stream = s; state.cam = "on"; state.photo = null; state.failed = false; render(); },
          function () { state.cam = "denied"; render(); });
}
function shoot() {
  var v = document.getElementById("live"); if (!v || !v.videoWidth) return;
  var c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob(function (blob) { stopCam(); scan(blob); }, "image/jpeg", 0.92);
}
function open(text) { stopCam(); state.text = text; state.screen = "result"; state.tab = 0; state.busy = false; state.failed = false; state.typing = false; state.fixing = false; render(); window.scrollTo(0, 0); }
function scan(file) {
  if (!file) return;
  if (state.photo) URL.revokeObjectURL(state.photo);
  state.photo = URL.createObjectURL(file); state.busy = true; state.failed = false; render();
  var fail = function () { state.busy = false; state.failed = true; state.typing = true; render(); };
  try {
    readPhoto(file, function (f) { var el = document.getElementById("prog"); if (el) el.textContent = T[state.lang].reading + " " + Math.round(f * 100) + "%"; })
      .then(function (text) { if (text && text.trim().length > 20) open(text); else fail(); }, fail);
  } catch (e) { fail(); }
}

// ================= 6. Buttons =================
document.querySelectorAll("header .pill button").forEach(function (b) { b.addEventListener("click", function () { state.lang = b.dataset.lang; render(); }); });
app.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.id === "startcam") startCam();
  else if (b.id === "shoot") shoot();
  else if (b.dataset.ex) { state.served = b.dataset.ex === "sum" ? "2026-10-01" : ""; state.photo = null; open(EXAMPLES[b.dataset.ex]); }
  else if (b.dataset.tab) { state.tab = +b.dataset.tab; state.fixing = false; render(); }
  else if (b.id === "type") { state.typing = true; render(); document.getElementById("typed").focus(); }
  else if (b.id === "go") { var v = document.getElementById("typed").value; if (v.trim()) open(v); }
  else if (b.id === "fix") { state.fixing = true; render(); }
  else if (b.id === "refix") { state.text = document.getElementById("fixed").value; state.fixing = false; render(); }
  else if (b.id === "again") { state.screen = "scan"; state.photo = null; state.served = ""; render(); window.scrollTo(0, 0); }
  else if (b.id === "copy") {
    var box = document.getElementById("msg"), done = function () { b.textContent = T[state.lang].copied; };
    var pick = function () { var r = document.createRange(); r.selectNodeContents(box); var s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(box.textContent).then(done, pick); } catch (err) { pick(); }
  }
});
app.addEventListener("change", function (e) {
  var id = e.target.id;
  if (id === "camera" || id === "library") { stopCam(); return scan(e.target.files[0]); }
  if (id === "served") state.served = e.target.value;
  else if (id === "how") state.how = e.target.value;
  else if (id === "interp") state.interp = e.target.value;
  else return;
  render();
});
render();
</script>
</body>
